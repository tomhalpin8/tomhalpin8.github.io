</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="Thomas Halpin home">Thomas Halpin</a>
        <nav class="nav-links" aria-label="Primary navigation">
            <a href="index.html">Home</a>
            <a href="motion-capture.html">Mocap</a>
            <a href="unreal-cinematics.html">Cinematics</a>
            <a href="realtime-retargeting.html">Retargeting</a>
        </nav>
    </header>

    <main>
        <section class="subpage-hero contact-hero">
            <video class="hero-video" autoplay muted loop playsinline preload="metadata" poster="assets/images/poster-mocap-unreal-realtime-retargeting.jpg">
                <source src="assets/clips/mocap-unreal-realtime-retargeting.mp4" type="video/mp4">
            </video>
            <div class="hero-overlay"></div>
            <div class="hero-copy narrow">
                <p class="eyebrow">Contact</p>
                <h1>Send an email.</h1>
                <p>For realtime capture, retargeting, MetaHuman, and Unreal cinematics work.</p>
            </div>
        </section>

        <section class="section email-section">
            <div class="section-heading">
                <p class="section-kicker">Email</p>
                <h2>tomhalpin8<wbr>@gmail.com</h2>
            </div>
            <form class="contact-form" id="email-form" action="mailto:tomhalpin8@gmail.com" method="post" enctype="text/plain">
                <label>
                    Name
                    <input name="name" autocomplete="name">
                </label>
                <label>
                    Email
                    <input name="email" type="email" autocomplete="email">
                </label>
                <label>
                    Subject
                    <input name="subject" value="Portfolio inquiry">
                </label>
                <label>
                    Message
                    <textarea name="message" rows="7" required></textarea>
                </label>
                <button class="button button-primary" type="submit">Open Email</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <span>Thomas Halpin</span>
        <nav aria-label="Footer navigation">
            <a href="index.html">Home</a>
            <a href="motion-capture.html">Mocap</a>
            <a href="unreal-cinematics.html">Cinematics</a>
            <a href="realtime-retargeting.html">Retargeting</a>
        </nav>
        <div class="footer-social" aria-label="Social links">
            <a class="icon-link" href="https://www.linkedin.com/in/thomas-halpin-42718980/?skipRedirect=true" target="_blank" rel="noreferrer" aria-label="LinkedIn" title="LinkedIn">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.3 8.2h4.4V23H.3V8.2zM7.4 8.2h4.22v2.02h.06c.59-1.11 2.03-2.29 4.18-2.29 4.47 0 5.29 2.94 5.29 6.76V23h-4.39v-7.36c0-1.75-.03-4.01-2.44-4.01-2.45 0-2.82 1.91-2.82 3.88V23H7.4V8.2z" />
                </svg>
            </a>
            <a class="icon-link" href="https://x.com/Maslp9" target="_blank" rel="noreferrer" aria-label="X" title="X">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M18.9 1.5h3.68l-8.04 9.19L24 22.5h-7.42l-5.81-7.59-6.65 7.59H.44l8.6-9.83L0 1.5h7.61l5.25 6.94L18.9 1.5zm-1.29 18.92h2.04L6.5 3.47H4.31l13.3 16.95z" />
                </svg>
            </a>
            <a class="icon-link" href="contact.html" aria-label="Email" title="Email">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                    <path d="M4 6h16v12H4V6z" />
                    <path d="m4 7 8 6 8-6" />
                </svg>
            </a>
        </div>
    </footer>

    <script>
        const form = document.getElementById("email-form");

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const data = new FormData(form);
            const name = data.get("name") || "";
            const email = data.get("email") || "";
            const subject = data.get("subject") || "Portfolio inquiry";
            const message = data.get("message") || "";
            const body = [
                name ? `Name: ${name}` : "",
                email ? `Email: ${email}` : "",
                "",
                message
            ].join("\n").trim();

            window.location.href = `mailto:tomhalpin8@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        });
    </script>
</body>
</html>
